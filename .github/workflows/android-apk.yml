name: Android APK – Norroena (Gunnar Neural)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build Norroena 1.1 with Icelandic neural speech
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: |
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses > /dev/null || true
          "$SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Install neural Icelandic text-to-speech engine
        run: python3 -m pip install --disable-pip-version-check 'edge-tts==7.3.1'
      - name: Generate all 127 unique Icelandic neural MP3s
        run: |
          python3 tools/generate_audio.py
          test "$(find audio -type f -name '*.mp3' | wc -l)" -eq 127
      - name: Build installable offline Android APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Publish Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Norroena-1.1-Neural-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
